name: Véhicules — tests & déploiement Apps Script

on:
  push:
    paths:
      - 'tohmo-vehicules-module/**'
      - '.github/workflows/vehicules-ci-cd.yml'
  pull_request:
    paths:
      - 'tohmo-vehicules-module/**'
  workflow_dispatch: {}

jobs:
  test:
    name: Tests (Jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tohmo-vehicules-module
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm test

  deploy:
    name: Déploiement vers Apps Script
    needs: test
    runs-on: ubuntu-latest
    # Déclenchement manuel uniquement pour l'instant (bouton "Run workflow" dans l'onglet Actions,
    # ou déclenché à la demande) — ça évite qu'un simple push republie automatiquement la prod
    # tant que le pipeline n'a pas fait ses preuves. À changer pour un déclenchement automatique
    # sur push (ex. vers une branche "main" dédiée) une fois que c'est validé, voir le README.
    if: github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: tohmo-vehicules-module
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Installer clasp
        run: npm install -g @google/clasp
      - name: Configurer les identifiants clasp
        run: echo "$CLASP_CREDENTIALS" > ~/.clasprc.json
        env:
          CLASP_CREDENTIALS: ${{ secrets.CLASP_CREDENTIALS }}
      - name: Configurer le projet Apps Script cible
        run: |
          echo "{\"scriptId\":\"$APPS_SCRIPT_ID\",\"rootDir\":\".\"}" > .clasp.json
        env:
          APPS_SCRIPT_ID: ${{ vars.APPS_SCRIPT_ID }}
      - name: Pousser le code vers Apps Script
        run: clasp push --force
      - name: Mettre à jour le déploiement de prod
        run: clasp deploy -i "$APPS_SCRIPT_DEPLOYMENT_ID" -d "Déploiement auto — ${{ github.sha }}"
        env:
          APPS_SCRIPT_DEPLOYMENT_ID: ${{ vars.APPS_SCRIPT_DEPLOYMENT_ID }}
