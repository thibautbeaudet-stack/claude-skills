<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tickets — Tohmo Hub</title>
  <style>
    :root{
      --bg:#FFFFFF;--inset:#F3F2ED;--ink:#111110;--soft:#57564F;--mute:#8E8D84;
      --line:#E7E5DC;--line2:#D7D5CA;--lime:#DFFF36;--blue:#24D7FF;
      --gi:#356B12;--gt:#E9FBDF;--ri:#A62521;--rt:#FBE4E4;--ai:#7A5A00;--at:#FFF6D6;--bi:#0A6076;--bt:#E7FBFF;--pi:#6B2F9E;--pt:#F1E2FC;
    }
    *{box-sizing:border-box;}
    body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);}
    .rainbow{height:6px;width:100%;background:linear-gradient(90deg,var(--blue),#B86FF0,#A1FF71,var(--lime));}
    header{display:flex;align-items:center;justify-content:space-between;padding:18px 28px;border-bottom:1px solid var(--line);flex-wrap:wrap;gap:12px;}
    header h1{font-size:20px;margin:0;}
    header .back{font-size:13px;color:var(--soft);text-decoration:none;}
    header .back:hover{color:var(--ink);}
    .actions{display:flex;gap:10px;}
    button{font-family:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line2);background:var(--bg);color:var(--ink);padding:9px 14px;font-size:14px;}
    button.primary{background:var(--lime);border-color:var(--lime);color:var(--ink);font-weight:600;}
    button.primary:hover{filter:brightness(0.96);}
    button.ghost{background:transparent;border-color:transparent;color:var(--soft);}
    button:disabled{opacity:.5;cursor:not-allowed;}
    main{padding:24px 28px;max-width:1200px;margin:0 auto;}

    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px;}
    .stat{background:var(--inset);border:1px solid var(--line);border-radius:14px;padding:16px;}
    .stat .n{font-size:26px;font-weight:700;}
    .stat .l{font-size:12px;color:var(--soft);margin-top:2px;}

    .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px;}
    .toolbar select,.toolbar input[type=text]{font-family:inherit;padding:9px 12px;border-radius:10px;border:1px solid var(--line2);font-size:14px;background:var(--bg);}
    .toolbar input[type=text]{flex:1;min-width:200px;}

    table{width:100%;border-collapse:collapse;background:var(--bg);border:1px solid var(--line);border-radius:14px;overflow:hidden;}
    thead th{text-align:left;font-size:12px;color:var(--soft);text-transform:uppercase;letter-spacing:.03em;padding:10px 14px;background:var(--inset);border-bottom:1px solid var(--line);}
    tbody td{padding:12px 14px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top;}
    tbody tr:last-child td{border-bottom:none;}
    tbody tr{cursor:pointer;}
    tbody tr:hover{background:var(--inset);}
    .empty{text-align:center;color:var(--mute);padding:40px;}

    .badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;}
    .st-Nouveau{background:var(--bt);color:var(--bi);}
    .st-En-cours{background:var(--at);color:var(--ai);}
    .st-Résolu{background:var(--gt);color:var(--gi);}
    .st-Fermé{background:var(--inset);color:var(--soft);}
    .pr-Urgente{background:var(--rt);color:var(--ri);}
    .pr-Haute{background:var(--at);color:var(--ai);}
    .pr-Normale{background:var(--inset);color:var(--soft);}
    .pr-Basse{background:var(--inset);color:var(--mute);}
    .type-pill{background:var(--pt);color:var(--pi);}
    .src-qr{font-size:11px;color:var(--mute);}
    .to-validate{background:var(--at);color:var(--ai);border-radius:6px;padding:1px 6px;font-size:11px;margin-left:6px;}

    /* Drawer détail */
    .overlay{position:fixed;inset:0;background:rgba(17,17,16,.35);display:none;align-items:stretch;justify-content:flex-end;z-index:50;}
    .overlay.open{display:flex;}
    .drawer{width:480px;max-width:100%;background:var(--bg);height:100%;overflow-y:auto;padding:24px;border-left:1px solid var(--line);}
    .drawer h2{margin:0 0 4px;font-size:18px;}
    .drawer .sub{color:var(--soft);font-size:13px;margin-bottom:18px;}
    .field-row{display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
    .field-row > div{flex:1;min-width:120px;}
    .field-row label{display:block;font-size:11px;color:var(--soft);text-transform:uppercase;letter-spacing:.03em;margin-bottom:4px;}
    .box{background:var(--inset);border-radius:10px;padding:12px;font-size:14px;margin-bottom:14px;white-space:pre-wrap;}
    .timeline{border-left:2px solid var(--line2);margin:14px 0 14px 6px;padding-left:16px;}
    .tl-item{margin-bottom:14px;position:relative;}
    .tl-item::before{content:'';position:absolute;left:-21px;top:4px;width:9px;height:9px;border-radius:50%;background:var(--lime);border:2px solid var(--bg);}
    .tl-item .meta{font-size:11px;color:var(--mute);}
    .tl-item .content{font-size:14px;margin-top:2px;}
    textarea{width:100%;font-family:inherit;font-size:14px;padding:10px;border-radius:10px;border:1px solid var(--line2);resize:vertical;min-height:70px;}
    .close-x{position:absolute;top:18px;right:18px;background:none;border:none;font-size:20px;cursor:pointer;color:var(--soft);}

    /* Modal nouveau ticket */
    .modal-card{background:var(--bg);border-radius:16px;padding:24px;width:480px;max-width:92vw;max-height:88vh;overflow-y:auto;}
    .modal-overlay{position:fixed;inset:0;background:rgba(17,17,16,.35);display:none;align-items:center;justify-content:center;z-index:60;}
    .modal-overlay.open{display:flex;}
    input[type=text],input[type=email],select{width:100%;font-family:inherit;padding:9px 12px;border-radius:10px;border:1px solid var(--line2);font-size:14px;}
    .form-row{margin-bottom:12px;}
    .form-row label{display:block;font-size:12px;color:var(--soft);margin-bottom:5px;}
    .err{color:var(--ri);font-size:13px;margin-top:8px;}
    #toast{position:fixed;bottom:20px;right:20px;background:var(--ink);color:#fff;padding:12px 18px;border-radius:10px;font-size:14px;display:none;z-index:99;}
  </style>
</head>
<body>
  <div class="rainbow"></div>
  <header>
    <div>
      <a class="back" href="?">← Retour au Hub</a>
      <h1>🎫 Tickets</h1>
    </div>
    <div class="actions">
      <button class="primary" onclick="ouvrirModalNouveau()">+ Nouveau ticket</button>
    </div>
  </header>

  <main>
    <div class="stats" id="stats"></div>

    <div class="toolbar">
      <select id="fStatut" onchange="render()">
        <option value="">Tous les statuts</option>
        <option>Nouveau</option><option>En cours</option><option>Résolu</option><option>Fermé</option>
      </select>
      <select id="fType" onchange="render()">
        <option value="">Tous les types</option>
        <option value="badge">Badge</option>
        <option value="courrier">Courrier</option>
        <option value="panne_casse">Panne / Casse</option>
        <option value="casier">Casier</option>
        <option value="proprete">Propreté</option>
        <option value="autre">Autre</option>
      </select>
      <input type="text" id="fRecherche" placeholder="Rechercher (objet, nom, description...)" oninput="render()">
    </div>

    <table>
      <thead>
        <tr><th>ID</th><th>Type</th><th>Objet</th><th>Demandeur</th><th>Priorité</th><th>Statut</th><th>Créé le</th></tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </main>

  <!-- Drawer détail -->
  <div class="overlay" id="drawerOverlay" onclick="if(event.target===this) fermerDrawer()">
    <div class="drawer" id="drawer"></div>
  </div>

  <!-- Modal nouveau ticket -->
  <div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this) fermerModalNouveau()">
    <div class="modal-card" id="modalNouveau"></div>
  </div>

  <div id="toast"></div>

<script>
var SR = (typeof google!=='undefined' && google.script && google.script.run);
function srv(fn, args, cb) {
  if (SR) {
    var r = google.script.run.withSuccessHandler(cb).withFailureHandler(function(e){ showToast('Erreur : ' + e.message); });
    r[fn].apply(r, args || []);
  } else {
    // MOCK pour prévisualisation locale (hors Apps Script)
    setTimeout(function(){ cb(mock(fn, args)); }, 150);
  }
}

var TYPE_LABELS = { badge:'Badge', courrier:'Courrier', panne_casse:'Panne / Casse', casier:'Casier', proprete:'Propreté', autre:'Autre' };

var STATE = { tickets: [], stats: {}, ouvert: null };

function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  setTimeout(function(){ t.style.display = 'none'; }, 3000);
}

function charger() {
  srv('getTickets', [], function(rows){ STATE.tickets = rows; render(); });
  srv('getStatsTickets', [], function(s){ STATE.stats = s; renderStats(); });
}

function renderStats() {
  var s = STATE.stats;
  document.getElementById('stats').innerHTML = [
    stat(s.ouverts, 'Tickets ouverts'),
    stat(s.total, 'Total'),
    stat(s.tempsMoyenJours!=null ? s.tempsMoyenJours + ' j' : '—', 'Temps moyen de résolution'),
    stat(s.resolus, 'Résolus')
  ].join('');
}
function stat(n, l) { return '<div class="stat"><div class="n">'+n+'</div><div class="l">'+l+'</div></div>'; }

function render() {
  var fs = document.getElementById('fStatut').value;
  var ft = document.getElementById('fType').value;
  var fr = document.getElementById('fRecherche').value.trim().toLowerCase();

  var rows = STATE.tickets.filter(function(t){
    if (fs && t.statut !== fs) return false;
    if (ft && t.type !== ft) return false;
    if (fr) {
      var blob = [t.id,t.objet,t.description,t.demandeur_nom,t.demandeur_email,t.site,t.localisation].join(' ').toLowerCase();
      if (blob.indexOf(fr) === -1) return false;
    }
    return true;
  });

  var tbody = document.getElementById('tbody');
  if (!rows.length) {
    tbody.innerHTML = '<tr><td colspan="7" class="empty">Aucun ticket ne correspond à ces filtres.</td></tr>';
    return;
  }
  tbody.innerHTML = rows.map(function(t){
    var av = t.statut_validation === 'a_valider' ? '<span class="to-validate">à valider</span>' : '';
    return '<tr onclick="ouvrirDrawer(\''+t.id+'\')">'
      + '<td>'+t.id+'</td>'
      + '<td><span class="badge type-pill">'+ (TYPE_LABELS[t.type]||t.type) +'</span></td>'
      + '<td>'+ esc(t.objet || '—') + av +'</td>'
      + '<td>'+ esc(t.demandeur_nom||'—') + (t.source==='qr' ? ' <span class="src-qr">(QR)</span>' : '') +'</td>'
      + '<td><span class="badge pr-'+t.priorite+'">'+t.priorite+'</span></td>'
      + '<td><span class="badge st-'+String(t.statut).replace(' ','-')+'">'+t.statut+'</span></td>'
      + '<td>'+t.cree_le+'</td>'
      + '</tr>';
  }).join('');
}

function esc(s){ var d=document.createElement('div'); d.textContent = s==null?'':s; return d.innerHTML; }

// ---------- Drawer détail ----------
function ouvrirDrawer(id) {
  STATE.ouvert = id;
  srv('getTicket', [id], function(t){
    document.getElementById('drawer').innerHTML = drawerHtml(t);
    document.getElementById('drawerOverlay').classList.add('open');
  });
}
function fermerDrawer() { document.getElementById('drawerOverlay').classList.remove('open'); charger(); }

function drawerHtml(t) {
  var donnees = t.donnees || {};
  var champsSpecifiques = Object.keys(donnees).map(function(k){
    var v = donnees[k];
    if (k === 'photo_url' && v) return '<div class="field-row"><div><label>Photo</label><a href="'+v+'" target="_blank">Voir la photo</a></div></div>';
    return '<div class="field-row"><div><label>'+k.replace(/_/g,' ')+'</label>'+esc(v)+'</div></div>';
  }).join('');

  var timeline = (t.historique||[]).map(function(e){
    return '<div class="tl-item"><div class="meta">'+e.cree_le+' — '+esc(e.auteur||'')+'</div><div class="content">'+esc(e.contenu)+'</div></div>';
  }).join('') || '<div class="tl-item"><div class="content" style="color:var(--mute)">Aucun évènement</div></div>';

  return ''
    + '<button class="close-x" onclick="fermerDrawer()">×</button>'
    + '<h2>'+t.id+'</h2>'
    + '<div class="sub"><span class="badge type-pill">'+(TYPE_LABELS[t.type]||t.type)+'</span> · créé le '+t.cree_le+' · source : '+t.source+'</div>'

    + '<div class="field-row">'
      + '<div><label>Statut</label><select id="drawStatut">'
        + ['Nouveau','En cours','Résolu','Fermé'].map(function(s){return '<option '+(s===t.statut?'selected':'')+'>'+s+'</option>';}).join('')
      + '</select></div>'
      + '<div><label>Priorité</label><select id="drawPriorite">'
        + ['Basse','Normale','Haute','Urgente'].map(function(p){return '<option '+(p===t.priorite?'selected':'')+'>'+p+'</option>';}).join('')
      + '</select></div>'
    + '</div>'
    + '<button class="primary" onclick="appliquerStatut(\''+t.id+'\')" style="margin-bottom:16px">Mettre à jour</button>'

    + '<div class="field-row"><div><label>Objet</label>'+esc(t.objet||'—')+'</div></div>'
    + '<div class="box">'+esc(t.description||'—')+'</div>'

    + '<div class="field-row">'
      + '<div><label>Demandeur</label>'+esc(t.demandeur_nom||'—')+'</div>'
      + '<div><label>Email</label>'+esc(t.demandeur_email||'—')+'</div>'
    + '</div>'
    + '<div class="field-row">'
      + '<div><label>Site</label>'+esc(t.site||'—')+'</div>'
      + '<div><label>Localisation</label>'+esc(t.localisation||'—')+'</div>'
    + '</div>'
    + champsSpecifiques

    + '<h3 style="font-size:14px;margin:20px 0 4px;">Timeline</h3>'
    + '<div class="timeline">'+timeline+'</div>'

    + '<label style="font-size:12px;color:var(--soft);display:block;margin-bottom:5px;">Ajouter un commentaire</label>'
    + '<textarea id="drawComment" placeholder="Votre réponse ou note interne..."></textarea>'
    + '<button class="primary" style="margin-top:8px" onclick="envoyerCommentaire(\''+t.id+'\')">Ajouter</button>';
}

function appliquerStatut(id) {
  var statut = document.getElementById('drawStatut').value;
  var priorite = document.getElementById('drawPriorite').value;
  srv('majStatutTicket', [id, statut, ''], function(){
    srv('majTicket', [id, {priorite: priorite}], function(){
      showToast('Ticket mis à jour');
      ouvrirDrawer(id);
    });
  });
}

function envoyerCommentaire(id) {
  var texte = document.getElementById('drawComment').value.trim();
  if (!texte) return;
  srv('addCommentaire', [id, texte], function(){
    showToast('Commentaire ajouté');
    ouvrirDrawer(id);
  });
}

// ---------- Modal nouveau ticket (création côté hub) ----------
function ouvrirModalNouveau() {
  document.getElementById('modalNouveau').innerHTML = ''
    + '<h2 style="margin-top:0">Nouveau ticket</h2>'
    + '<div class="form-row"><label>Type</label><select id="nType">'
      + '<option value="badge">Badge</option><option value="courrier">Courrier</option>'
      + '<option value="panne_casse">Panne / Casse</option><option value="casier">Casier</option>'
      + '<option value="proprete">Propreté</option><option value="autre">Autre</option>'
    + '</select></div>'
    + '<div class="form-row"><label>Objet</label><input type="text" id="nObjet"></div>'
    + '<div class="form-row"><label>Description</label><textarea id="nDescription"></textarea></div>'
    + '<div class="form-row"><label>Nom du demandeur</label><input type="text" id="nNom"></div>'
    + '<div class="form-row"><label>Email du demandeur</label><input type="email" id="nEmail"></div>'
    + '<div class="form-row"><label>Site</label><input type="text" id="nSite"></div>'
    + '<div class="form-row"><label>Priorité</label><select id="nPriorite">'
      + '<option>Basse</option><option selected>Normale</option><option>Haute</option><option>Urgente</option>'
    + '</select></div>'
    + '<div id="nErr" class="err"></div>'
    + '<div style="display:flex;gap:10px;margin-top:14px;">'
      + '<button class="primary" onclick="creerTicket()">Créer</button>'
      + '<button class="ghost" onclick="fermerModalNouveau()">Annuler</button>'
    + '</div>';
  document.getElementById('modalOverlay').classList.add('open');
}
function fermerModalNouveau() { document.getElementById('modalOverlay').classList.remove('open'); }

function creerTicket() {
  var data = {
    type: document.getElementById('nType').value,
    objet: document.getElementById('nObjet').value.trim(),
    description: document.getElementById('nDescription').value.trim(),
    demandeur_nom: document.getElementById('nNom').value.trim(),
    demandeur_email: document.getElementById('nEmail').value.trim(),
    site: document.getElementById('nSite').value.trim(),
    priorite: document.getElementById('nPriorite').value,
    donnees: {}
  };
  if (!data.objet) { document.getElementById('nErr').textContent = 'L\'objet est obligatoire.'; return; }
  srv('addTicket', [data], function(){
    fermerModalNouveau();
    showToast('Ticket créé');
    charger();
  });
}

// ---------- MOCK (prévisualisation locale hors Apps Script) ----------
function mock(fn, args) {
  window.__MOCK_TICKETS = window.__MOCK_TICKETS || [
    { id:'TIK-20260710-482', type:'badge', statut:'Nouveau', priorite:'Normale', objet:'Badge accès site Lyon', description:'Nouvelle arrivée, besoin d\'un badge.', demandeur_nom:'Julie Martin', demandeur_email:'julie.martin@tohmo.fr', site:'Lyon', localisation:'', donnees_specifiques:'{"motif":"Nouvelle arrivée"}', commentaire_om:'', date_resolution:'', source:'qr', statut_validation:'a_valider', cree_le:'10/07/2026 09:12', cree_par:'julie.martin@tohmo.fr', maj_le:'10/07/2026 09:12' },
    { id:'TIK-20260709-113', type:'panne_casse', statut:'En cours', priorite:'Haute', objet:'Écran cassé salle réunion', description:'L\'écran de la salle Zeplug ne s\'allume plus.', demandeur_nom:'Marc Petit', demandeur_email:'marc.petit@tohmo.fr', site:'Paris', localisation:'Salle Zeplug, 3e étage', donnees_specifiques:'{}', commentaire_om:'', date_resolution:'', source:'qr', statut_validation:'valide', cree_le:'09/07/2026 14:03', cree_par:'marc.petit@tohmo.fr', maj_le:'10/07/2026 08:00' },
    { id:'TIK-20260705-901', type:'courrier', statut:'Résolu', priorite:'Normale', objet:'Courrier pour URSSAF', description:'', demandeur_nom:'Sarah Dupont', demandeur_email:'sarah.dupont@tohmo.fr', site:'Paris', localisation:'', donnees_specifiques:'{"destinataire":"URSSAF","type_envoi":"Recommandé"}', commentaire_om:'', date_resolution:'06/07/2026 10:00', source:'hub', statut_validation:'valide', cree_le:'05/07/2026 11:00', cree_par:'office@tohmo.fr', maj_le:'06/07/2026 10:00' }
  ];
  window.__MOCK_HIST = window.__MOCK_HIST || {};

  if (fn === 'getTickets') {
    return window.__MOCK_TICKETS.map(function(t){
      var c = Object.assign({}, t);
      try { c.donnees = JSON.parse(c.donnees_specifiques||'{}'); } catch(e){ c.donnees = {}; }
      return c;
    });
  }
  if (fn === 'getStatsTickets') {
    var rows = window.__MOCK_TICKETS;
    return { total: rows.length, ouverts: rows.filter(function(t){return t.statut==='Nouveau'||t.statut==='En cours';}).length, resolus: rows.filter(function(t){return t.date_resolution;}).length, tempsMoyenJours: 1.2 };
  }
  if (fn === 'getTicket') {
    var t = window.__MOCK_TICKETS.filter(function(r){return r.id===args[0];})[0];
    var c = Object.assign({}, t);
    try { c.donnees = JSON.parse(c.donnees_specifiques||'{}'); } catch(e){ c.donnees = {}; }
    c.historique = window.__MOCK_HIST[t.id] || [{ cree_le:t.cree_le, auteur:t.demandeur_nom, contenu:'Ticket créé' }];
    return c;
  }
  if (fn === 'majStatutTicket') {
    var t = window.__MOCK_TICKETS.filter(function(r){return r.id===args[0];})[0];
    t.statut = args[1]; return true;
  }
  if (fn === 'majTicket') {
    var t = window.__MOCK_TICKETS.filter(function(r){return r.id===args[0];})[0];
    Object.assign(t, args[1]); return true;
  }
  if (fn === 'addCommentaire') {
    var id = args[0];
    window.__MOCK_HIST[id] = window.__MOCK_HIST[id] || [];
    window.__MOCK_HIST[id].push({ cree_le:'maintenant', auteur:'moi', contenu:args[1] });
    return true;
  }
  if (fn === 'addTicket') {
    var id2 = 'TIK-MOCK-' + Math.floor(Math.random()*900+100);
    window.__MOCK_TICKETS.unshift(Object.assign({ id:id2, statut:'Nouveau', source:'hub', statut_validation:'valide', cree_le:'maintenant', donnees_specifiques:'{}' }, args[0]));
    return id2;
  }
  return null;
}

charger();
</script>
</body>
</html>
